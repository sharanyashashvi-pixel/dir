<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Street Travel Journal & Project Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-yellow: #fffdf0;
      --card-pink: #ffe6f0;
      --card-yellow: #fff9c4;
      --card-peach: #ffe0b2;
      --card-mint: #e8f5e9;
      --accent-pink: #ff4081;
      --accent-yellow: #ffd54f;
      --accent-orange: #ff7043;
      --text-main: #3e2723;
      --shadow: 0 10px 25px rgba(62, 39, 35, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-yellow);
      background-image: 
        radial-gradient(#ffeb3b 15%, transparent 16%),
        radial-gradient(#ff4081 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      font-family: 'Quicksand', sans-serif;
      color: var(--text-main);
      padding: 30px 15px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .journal-container {
      max-width: 950px;
      margin: 0 auto;
      background: #ffffff;
      border: 4px dashed var(--accent-pink);
      border-radius: 35px;
      padding: 40px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .journal-container::before, .journal-container::after {
      content: '🌸 🌼 🌻 🌷';
      position: absolute;
      font-size: 1.8rem;
      letter-spacing: 15px;
      top: -20px;
      left: 40px;
    }
    .journal-container::after {
      top: auto;
      bottom: -20px;
      right: 40px;
      left: auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      border-bottom: 3px dotted var(--accent-orange);
      padding-bottom: 25px;
    }

    header h1 {
      font-family: 'Caveat', cursive;
      font-size: 3.8rem;
      color: var(--accent-pink);
      text-shadow: 2px 2px 0px var(--accent-yellow);
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      font-weight: 600;
      color: #6d4c41;
      background: var(--card-yellow);
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
      border: 2px solid var(--accent-orange);
    }

    .intro-box {
      background: var(--card-pink);
      border: 3px solid var(--accent-pink);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 35px;
      font-size: 1.15rem;
      line-height: 1.7;
      text-align: center;
    }

    .intro-box::after {
      content: '🍔 ☕ ✨';
      display: block
